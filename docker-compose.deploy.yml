services:

  app-db:
    image: postgres:16-alpine
    container_name: activos_db
    env_file:
      - ./.env

    ports:
      - $POSTGRES_PORT:$POSTGRES_PORT

    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_DB: $POSTGRES_DB
      PGPORT: $POSTGRES_PORT

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$POSTGRES_USER", "-d", "$POSTGRES_DB", "-p", "$POSTGRES_PORT"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    container_name: activos_backend
    image: ${DOCKER_REGISTRY:-local_activos}/backend:${TAG:-latest}
    build:
      dockerfile: dockerfile
      context: ./backend
    user: ${UID:-1000}:${GID:-1000}
    env_file:
      - ./.env

    environment:
      POSTGRES_HOST: app-db
      BACKEND_PORT: 3001

    ports:
      - 3001:3001

    depends_on:
      app-db:
        condition: service_healthy

    command: >
      sh -c "npx prisma migrate deploy &&
      npm run start:prod"

  reports-service:
    container_name: activos_reports_service
    image: ${DOCKER_REGISTRY:-local_activos}/reports-service:${TAG:-latest}
    build:
      dockerfile: dockerfile
      context: ./reports-service
    user: ${UID:-1000}:${GID:-1000}
    env_file:
      - ./.env

    environment:
      POSTGRES_HOST: app-db
      REPORTS_PORT: 3002

    ports:
      - 3002:3002

    depends_on:
      app-db:
        condition: service_healthy

    command: "npm run start:prod"

  auditoria:
    container_name: activos_auditoria
    image: ${DOCKER_REGISTRY:-local_activos}/auditoria:${TAG:-latest}
    build:
      dockerfile: dockerfile
      context: ./auditoria
    user: ${UID:-1000}:${GID:-1000}
    env_file:
      - ./.env

    environment:
      POSTGRES_HOST: app-db
      AUDIT_MS_PORT: 3003

    ports:
      - 3003:3003

    depends_on:
      app-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    command: "npm run dev"

  frontend:
    container_name: activos_frontend
    image: ${DOCKER_REGISTRY:-local_activos}/frontend:${TAG:-latest}
    build:
      dockerfile: dockerfile2
      context: ./frontend
    user: ${UID:-1000}:${GID:-1000}
    env_file:
      - ./.env

    environment:
      FRONTEND_PORT: 8084
      VITE_BACKEND_URL: http://backend:3001
      VITE_REPORTS_URL: http://reports-service:3002
      VITE_API_URL: http://localhost:8084/api
      VITE_REPORTS_API_URL: http://localhost:8084/reports-api
      VITE_AUDIT_API_URL: http://localhost:3003/api

    ports:
      - 8084:8084

    depends_on:
      backend:
        condition: service_started
      auditoria:
        condition: service_started
      reports-service:
        condition: service_started

volumes:
  postgres_data:
