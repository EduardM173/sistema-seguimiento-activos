name: activos_mobile
description: Sistema de Seguimiento de Activos — App Móvil
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.5

  # HTTP
  dio: ^5.4.3+1
  http_parser: ^4.0.2

  # Secure storage (JWT)
  flutter_secure_storage: ^9.2.2

  # QR Scanner
  mobile_scanner: ^5.2.3

  # Camera / Image picker
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.19.0

  # Loading shimmer
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
