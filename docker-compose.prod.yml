# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  —  Entorno de PRODUCCIÓN
#
# Mismas capas que dev, sin volúmenes de código fuente.
# Solo el gateway Nginx queda expuesto al host en PROD_GATEWAY_PORT.
#
# Prerequisito: cp .env.example .env  (con credenciales de producción reales)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  activos_prod_net:
    name: activos_prod_net

volumes:
  activos_pg_data_prod:
  activos_agent_pg_data_prod:
  activos_neo4j_data_prod:
  activos_uploads_prod:

x-nexus-build: &nexus-build
  args:
    NEXUS_URL: ${NEXUS_URL}

services:

  # ── Consul ────────────────────────────────────────────────────────────────
  consul:
    image: hashicorp/consul:1.18
    container_name: activos_consul_prod
    restart: unless-stopped
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "${PROD_CONSUL_UI_PORT:-18500}:8500"
    networks:
      - activos_prod_net

  # ── Base de datos principal ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: activos_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      PGPORT:            ${POSTGRES_PORT}
    volumes:
      - activos_pg_data_prod:/var/lib/postgresql/data
    networks:
      - activos_prod_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-p", "${POSTGRES_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # ── Backend (NestJS) ──────────────────────────────────────────────────────
  backend:
    container_name: activos_backend_prod
    build:
      context:    ./backend
      dockerfile: dockerfile.prod
      <<: *nexus-build
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_HOST:    postgres
      CONSUL_HOST:      consul
      CONSUL_PORT:      "8500"
      SERVICE_ADDRESS:  backend
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    volumes:
      - activos_uploads_prod:/app/uploads
    ports:
      - "${PROD_BACKEND_SWAGGER_PORT:-13001}:${BACKEND_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - activos_prod_net

  # ── Reports Service (NestJS) ──────────────────────────────────────────────
  reports:
    container_name: activos_reports_prod
    build:
      context:    ./reports-service
      dockerfile: dockerfile.prod
      <<: *nexus-build
    restart: unless-stopped
    env_file:
      - path: ./reports-service/.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_HOST:    postgres
      CONSUL_HOST:      consul
      CONSUL_PORT:      "8500"
      SERVICE_ADDRESS:  reports
    ports:
      - "${PROD_REPORTS_SWAGGER_PORT:-13002}:${REPORTS_PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - activos_prod_net

  # ── Auditoria (Express) ───────────────────────────────────────────────────
  auditoria:
    container_name: activos_auditoria_prod
    build:
      context:    ./auditoria
      dockerfile: dockerfile.prod
      <<: *nexus-build
    restart: unless-stopped
    env_file:
      - path: ./auditoria/.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_HOST:    postgres
      CONSUL_HOST:      consul
      CONSUL_PORT:      "8500"
      SERVICE_ADDRESS:  auditoria
    ports:
      - "${PROD_AUDITORIA_SWAGGER_PORT:-13003}:${AUDIT_MS_PORT:-3003}"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - activos_prod_net

  # ── Agent DB (pgvector) ───────────────────────────────────────────────────
  agent-postgres:
    image: pgvector/pgvector:pg16
    container_name: activos_agent_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${AGENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD}
      POSTGRES_DB:       ${AGENT_POSTGRES_DB}
    volumes:
      - activos_agent_pg_data_prod:/var/lib/postgresql/data
      - ./agent_service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - activos_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_POSTGRES_USER} -d ${AGENT_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Neo4j ─────────────────────────────────────────────────────────────────
  agent-neo4j:
    image: neo4j:5.26.23-community
    container_name: activos_neo4j_prod
    restart: unless-stopped
    environment:
      NEO4J_AUTH:                                      ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS:                                   '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted:     apoc.*
      NEO4J_ACCEPT_LICENSE_AGREEMENT:                  "yes"
    volumes:
      - activos_neo4j_data_prod:/data
    ports:
      - "${PROD_NEO4J_UI_PORT:-17474}:7474"
      - "${PROD_NEO4J_BOLT_PORT:-17687}:7687"
    networks:
      - activos_prod_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── Agent Service (Python / FastAPI) ──────────────────────────────────────
  agent:
    container_name: activos_agent_prod
    build:
      context:    ./agent_service
      dockerfile: dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: ./agent_service/.env
        required: false
      - path: ./.env
        required: false
    environment:
      # BD del agente — usa AGENT_POSTGRES_* del root .env para evitar
      # conflicto con POSTGRES_* de la BD principal (que también llega
      # vía env_file y compartiría el mismo nombre de variable).
      POSTGRES_HOST:        agent-postgres
      POSTGRES_USER:        ${AGENT_POSTGRES_USER}
      POSTGRES_PASSWORD:    ${AGENT_POSTGRES_PASSWORD}
      POSTGRES_DB:          ${AGENT_POSTGRES_DB}
      POSTGRES_PORT:        "5432"
      NEO4J_URI:            bolt://agent-neo4j:7687
      CONSUL_HOST:          consul
      CONSUL_PORT:          "8500"
      SERVICE_ADDRESS:      agent
      DEEPLINK_NAV_MAP_URL: http://nginx/activos-frontend/__deeplink/navigation-map.json
      EMBEDDING_MODEL:          ${EMBEDDING_MODEL}
      LLM_MODEL:                ${LLM_MODEL}
      LLM_TEMPERATURE:          ${LLM_TEMPERATURE}
      CHUNK_SIZE:               ${CHUNK_SIZE}
      CHUNK_OVERLAP:            ${CHUNK_OVERLAP}
      DSL_MAX_DEDUCTION_STEPS:  ${DSL_MAX_DEDUCTION_STEPS}
      DSL_SIMPLIFY_BEFORE_ANSWER: ${DSL_SIMPLIFY_BEFORE_ANSWER}
    ports:
      - "${PROD_AGENT_DOCS_PORT:-18000}:${APP_PORT:-8000}"
    depends_on:
      agent-postgres:
        condition: service_healthy
      agent-neo4j:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - activos_prod_net

  # ── Gateway Nginx — ÚNICO SERVICIO EXPUESTO AL HOST ───────────────────────
  nginx:
    container_name: activos_nginx_prod
    build:
      context:    .
      dockerfile: nginx/dockerfile
      <<: *nexus-build
    restart: unless-stopped
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      APP_DOMAIN:  ${APP_DOMAIN}
    ports:
      - "${PROD_GATEWAY_PORT:-80}:80"
    depends_on:
      - consul
      - backend
      - reports
      - auditoria
      - agent
    networks:
      - activos_prod_net
