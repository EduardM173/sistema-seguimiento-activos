# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  —  Entorno de PRODUCCIÓN
#
# Mismas capas que dev, sin volúmenes de código fuente.
# Solo el gateway Nginx queda expuesto al host en PROD_GATEWAY_PORT.
#
# Prerequisito: cp .env.example .env  (con credenciales de producción reales)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  activos_prod_net:
    name: activos_prod_net

volumes:
  activos_pg_data_prod:
  activos_agent_pg_data_prod:
  activos_neo4j_data_prod:
  activos_uploads_prod:

x-nexus-build: &nexus-build
  args:
    NEXUS_URL: ${NEXUS_URL:-https://nexus.dontrisk.org/repository/activos/}

services:

  # ── Consul ────────────────────────────────────────────────────────────────
  consul:
    image: hashicorp/consul:1.18
    container_name: activos_consul_prod
    restart: unless-stopped
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -advertise=consul
    ports:
      - "${PROD_CONSUL_UI_PORT:-8500}:8500"
    networks:
      - activos_prod_net

  # ── Base de datos principal ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: activos_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      PGPORT:            ${POSTGRES_PORT:-5432}
    volumes:
      - activos_pg_data_prod:/var/lib/postgresql/data
    networks:
      - activos_prod_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-p", "${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (NestJS) ──────────────────────────────────────────────────────
  backend:
    container_name: activos_backend_prod
    build:
      context:    .
      dockerfile: backend/dockerfile.prod
      <<: *nexus-build
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_HOST:    postgres
      POSTGRES_PORT:    ${POSTGRES_PORT:-5432}
      BACKEND_PORT:     ${BACKEND_PORT:-3001}
      CONSUL_HOST:      consul
      CONSUL_PORT:      "8500"
      SERVICE_ADDRESS:  backend
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    volumes:
      - activos_uploads_prod:/app/backend/uploads
    ports:
      - "${PROD_BACKEND_SWAGGER_PORT:-3001}:${BACKEND_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - activos_prod_net

  # ── Reports Service (NestJS) ──────────────────────────────────────────────
  reports:
    container_name: activos_reports_prod
    build:
      context:    .
      dockerfile: reports-service/dockerfile.prod
      <<: *nexus-build
    restart: unless-stopped
    env_file:
      - path: ./reports-service/.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_HOST:    postgres
      POSTGRES_PORT:    ${POSTGRES_PORT:-5432}
      REPORTS_PORT:     ${REPORTS_PORT:-3002}
      CONSUL_HOST:      consul
      CONSUL_PORT:      "8500"
      SERVICE_ADDRESS:  reports
    ports:
      - "${PROD_REPORTS_SWAGGER_PORT:-3002}:${REPORTS_PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - activos_prod_net

  # ── Auditoria (Express) ───────────────────────────────────────────────────
  auditoria:
    container_name: activos_auditoria_prod
    build:
      context:    .
      dockerfile: auditoria/dockerfile.prod
      <<: *nexus-build
    restart: unless-stopped
    env_file:
      - path: ./auditoria/.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_HOST:    postgres
      POSTGRES_PORT:    ${POSTGRES_PORT:-5432}
      AUDIT_MS_PORT:    ${AUDIT_MS_PORT:-3003}
      CONSUL_HOST:      consul
      CONSUL_PORT:      "8500"
      SERVICE_ADDRESS:  auditoria
    ports:
      - "${PROD_AUDITORIA_SWAGGER_PORT:-3003}:${AUDIT_MS_PORT:-3003}"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - activos_prod_net

  # ── Agent DB (pgvector) ───────────────────────────────────────────────────
  agent-postgres:
    image: pgvector/pgvector:pg16
    container_name: activos_agent_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${AGENT_POSTGRES_USER:-graphrag}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-graphrag_secret}
      POSTGRES_DB:       ${AGENT_POSTGRES_DB:-graphrag}
    volumes:
      - activos_agent_pg_data_prod:/var/lib/postgresql/data
      - ./agent_service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - activos_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_POSTGRES_USER:-graphrag} -d ${AGENT_POSTGRES_DB:-graphrag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ─────────────────────────────────────────────────────────────────
  agent-neo4j:
    image: neo4j:5.26.23-community
    container_name: activos_neo4j_prod
    restart: unless-stopped
    environment:
      NEO4J_AUTH:                                      ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-graphrag_secret}
      NEO4J_PLUGINS:                                   '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted:     apoc.*
      NEO4J_ACCEPT_LICENSE_AGREEMENT:                  "yes"
    volumes:
      - activos_neo4j_data_prod:/data
    ports:
      - "${PROD_NEO4J_UI_PORT:-7474}:7474"
      - "${PROD_NEO4J_BOLT_PORT:-7687}:7687"
    networks:
      - activos_prod_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Agent Service (Python / FastAPI) ──────────────────────────────────────
  agent:
    container_name: activos_agent_prod
    build:
      context:    ./agent_service
      dockerfile: dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: ./agent_service/.env
        required: false
      - path: ./.env
        required: false
    environment:
      # BD del agente — usa AGENT_POSTGRES_* del root .env para evitar
      # conflicto con POSTGRES_* de la BD principal (que también llega
      # vía env_file y compartiría el mismo nombre de variable).
      POSTGRES_HOST:        agent-postgres
      POSTGRES_USER:        ${AGENT_POSTGRES_USER:-graphrag}
      POSTGRES_PASSWORD:    ${AGENT_POSTGRES_PASSWORD:-graphrag_secret}
      POSTGRES_DB:          ${AGENT_POSTGRES_DB:-graphrag}
      POSTGRES_PORT:        "5432"
      NEO4J_URI:            bolt://agent-neo4j:7687
      NEO4J_USER:           ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD:       ${NEO4J_PASSWORD:-graphrag_secret}
      CONSUL_HOST:          consul
      CONSUL_PORT:          "8500"
      SERVICE_ADDRESS:      agent
      DEEPLINK_NAV_MAP_URL: http://nginx/activos-frontend/__deeplink/navigation-map.json
      APP_PORT:                ${APP_PORT:-8000}
      EMBEDDING_MODEL:         ${EMBEDDING_MODEL:-text-embedding-004}
      LLM_MODEL:               ${LLM_MODEL:-gemini-2.0-flash}
      LLM_TEMPERATURE:         ${LLM_TEMPERATURE:-0.0}
      CHUNK_SIZE:              ${CHUNK_SIZE:-512}
      CHUNK_OVERLAP:           ${CHUNK_OVERLAP:-64}
      DSL_MAX_DEDUCTION_STEPS: ${DSL_MAX_DEDUCTION_STEPS:-100}
      DSL_SIMPLIFY_BEFORE_ANSWER: ${DSL_SIMPLIFY_BEFORE_ANSWER:-true}
    ports:
      - "${PROD_AGENT_DOCS_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      agent-postgres:
        condition: service_healthy
      agent-neo4j:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - activos_prod_net

  # ── Gateway Nginx — ÚNICO SERVICIO EXPUESTO AL HOST ───────────────────────
  nginx:
    container_name: activos_nginx_prod
    build:
      context:    .
      dockerfile: nginx/dockerfile
      <<: *nexus-build
    restart: unless-stopped
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      APP_DOMAIN:  ${APP_DOMAIN:-localhost}
    ports:
      - "${PROD_GATEWAY_PORT:-8080}:80"
    depends_on:
      - consul
      - backend
      - reports
      - auditoria
      - agent
    networks:
      - activos_prod_net
